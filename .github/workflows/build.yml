name: Build Flutter APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin to the SDK this project targets so the CI is stable
          flutter-version: '3.9.2'

      - name: Verify Flutter & Java environment
        run: |
          flutter --version
          flutter doctor -v
          java -version

      - name: Android SDK diagnostics
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          echo "PATH=$PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          df -h .
          ls -la $ANDROID_SDK_ROOT || true
          which sdkmanager || true

      - name: Install Android SDK packages
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          # Install required Android SDK components for building
          set -eux
          if which sdkmanager; then
            yes | sdkmanager --licenses || true
            sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          else
            echo "sdkmanager not found — printing environment for debugging"
            env
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --split-per-abi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/app-*.apk

      - name: Build APK (Debug)
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  docker_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build -t zillaeq-builder:latest .

      - name: Run Docker build (inside container)
        run: |
          # Run the container and build APK inside, keeping artifacts in /workspace/build
          docker run --rm -v "$GITHUB_WORKSPACE":/app -w /app zillaeq-builder:latest flutter build apk --release --split-per-abi

      - name: Upload Docker-built APKs
        uses: actions/upload-artifact@v4
        with:
          name: docker-release-apks
          path: build/app/outputs/flutter-apk/app-*.apk
