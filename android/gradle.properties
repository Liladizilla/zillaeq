org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=64m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
# Reduce parallelism/workers to lower memory pressure on low-RAM machines
org.gradle.workers.max=1
# Disable long-running Gradle daemon (safer on low-memory systems). This
# slows builds but avoids persistent daemon memory crashes. Remove or set to
# true if you have enough RAM and want faster incremental builds.
org.gradle.daemon=false
# Enable Gradle build cache (keeps artifacts in GRADLE_USER_HOME; ensure this
# is on a drive with space, e.g. D:\gradle_cache)
org.gradle.caching=true
